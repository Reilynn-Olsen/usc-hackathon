name: harbormind-app

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    # Reach a separately managed Jev container through its published host port.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
